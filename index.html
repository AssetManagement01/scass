<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCASS</title>
<style>
:root{--n:#16324f;--t:#0d9488;--m:#5b7380;--l:#c9dde0}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:var(--n);background:#e8f4ef}
#login{position:fixed;inset:0;display:flex;z-index:20;background:#eef7f5}
.brand{flex:7;background:linear-gradient(145deg,#0b4f37,#14b8a6);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:40px}
.form{flex:3;display:flex;flex-direction:column;justify-content:center;padding:28px;min-width:280px}
.erp{display:flex;min-height:100vh}
.sidebar{width:200px;min-width:200px;background:linear-gradient(180deg,#0b4f37,#0d9488);color:#e8f2ef;padding:16px 10px;display:flex;flex-direction:column}
.nav{display:block;width:100%;text-align:left;background:transparent;border:0;color:#d5ece7;padding:10px 12px;border-radius:10px;cursor:pointer}
.nav.on{background:#14b8a6;color:#08352c;font-weight:700}
.main{flex:1;min-width:0;padding:14px}
.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:14px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px}
input,select,.btn,.btn2,.btn3{font-size:16px;padding:10px;border-radius:10px}
input,select{width:100%;border:1px solid var(--l);background:#f4f8fa;margin:0}
.btn{border:0;background:var(--t);color:#fff;font-weight:700;cursor:pointer}
.btn2{border:0;background:#0f766e;color:#fff;font-weight:700;cursor:pointer}
.btn3{border:0;background:#8a2a2a;color:#fff;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid #eef4f6;text-align:left}
.muted{color:var(--m);font-size:13px}
.err{color:#b42318}
.hide{display:none !important}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.val{font-size:20px;font-weight:800}
@media (max-width:900px){
  #login{flex-direction:column}
  .brand{flex:0 0 28%;padding:16px;justify-content:flex-end}
  .form{flex:1;padding:16px 18px}
  .sidebar{width:148px;min-width:148px}
  .row{flex-direction:column}
  .row>*{width:100%}
}
</style>
</head>
<body>
<div id="login">
  <div class="brand">
    <div style="color:#fff;opacity:.9;margin-bottom:8px">SCASS</div>
    <h1 style="margin:0 0 8px;font-size:32px">Capital with clarity.</h1>
    <p style="margin:0;opacity:.95">NewStar Kancing</p>
  </div>
  <div class="form">
    <div style="text-align:center;font-weight:800;font-size:26px;color:#0b4f37;margin-bottom:16px">SCASS.com</div>
    <div class="row" style="flex-wrap:nowrap;align-items:center"><label style="width:84px">ID</label><input id="loginId"></div>
    <div class="row" style="flex-wrap:nowrap;align-items:center;margin-top:8px"><label style="width:84px">Password</label><input id="loginPass" type="password"></div>
    <button class="btn" style="width:100%;margin-top:12px" onclick="doLogin()">Sign in</button>
    <div id="loginInfo" class="muted" style="text-align:center;margin-top:8px"></div>
  </div>
</div>
<div id="app" class="erp hide">
  <aside class="sidebar">
    <div style="font-weight:800;font-size:18px">SCASS</div>
    <div class="muted" style="color:#9fb6c0;margin-bottom:12px">NewStar Kancing</div>
    <button class="nav on" id="n-dash" onclick="show('dash')">Dashboard</button>
    <button class="nav" id="n-inv" onclick="show('inv')">Inventory</button>
    <button class="nav" id="n-jual" onclick="show('jual')">Sales</button>
    <button class="nav" onclick="logout()" style="margin-top:auto">Sign out</button>
  </aside>
  <div class="main">
    <div id="m-dash">
      <b>Dashboard</b>
      <div class="muted" id="apiStatus">Memuat...</div>
      <div class="kpi" style="margin-top:10px">
        <div class="card"><div class="muted">SKU</div><div class="val" id="kSku">—</div></div>
        <div class="card"><div class="muted">Nilai stok</div><div class="val" id="kStok">—</div></div>
      </div>
    </div>
    <div id="m-inv" class="hide">
      <b>Inventory</b>
      <div class="muted">Stok dan harga barang</div>
      <div class="card" style="margin-top:10px">
        <b>Tambah / ubah barang</b>
        <div class="row" style="margin-top:8px">
          <input id="bSku" placeholder="SKU (kosongkan = otomatis)">
          <input id="bNama" placeholder="Nama barang">
          <input id="bKat" placeholder="Kategori">
          <input id="bSat" placeholder="Satuan">
          <input id="bStok" type="number" placeholder="Stok">
          <input id="bBeli" type="number" placeholder="Harga beli">
          <input id="bJual" type="number" placeholder="Harga jual">
          <input id="bMin" type="number" placeholder="Min stok">
          <button class="btn" onclick="saveBarang()">Simpan barang</button>
        </div>
        <div id="invInfo" class="muted"></div>
      </div>
      <div class="card" style="overflow:auto">
        <input id="invQ" placeholder="Search SKU / nama" oninput="paintInv()">
        <table><thead><tr><th>SKU</th><th>Nama</th><th>Kategori</th><th>Stok</th><th>Harga</th></tr></thead><tbody id="invBody"></tbody></table>
      </div>
    </div>
    <div id="m-jual" class="hide">
      <b>Sales</b>
      <div class="card" style="overflow:auto;margin-top:10px">
        <table><thead><tr><th>No Inv</th><th>Item</th><th>Qty</th><th>Status</th></tr></thead><tbody id="soBody"></tbody></table>
      </div>
    </div>
  </div>
</div>
<script>
var API='https://script.google.com/macros/s/AKfycbyxWOQQ_cVvZ_1nlvW9Zt0sABqfbTXHgc9uoZw4JR_atTPo3iVaNDZg_6A1PhDMwkoQ/exec';
var TOKEN='NSK-SCASS-2026';
var data={inventory:[],invoice:[]};
function rp(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}
function api(action,payload){
  return new Promise(function(ok,fail){
    var cb='cb'+Date.now()+Math.floor(Math.random()*999);
    var done=false;
    window[cb]=function(res){done=true;try{delete window[cb]}catch(e){};if(s&&s.parentNode)s.parentNode.removeChild(s);if(res&&res.ok===false)fail(new Error(res.error||'API'));else ok(res)};
    var s=document.createElement('script');
    s.src=API+'?action='+encodeURIComponent(action)+'&token='+encodeURIComponent(TOKEN)+'&payload='+encodeURIComponent(JSON.stringify(payload||{}))+'&callback='+cb;
    s.onerror=function(){fail(new Error('Network'))};
    document.head.appendChild(s);
    setTimeout(function(){if(!done)fail(new Error('API timeout'))},45000);
  });
}
function validLogin(id,pass){
  var I=id.trim(),P=pass.trim(),U=I.toUpperCase();
  if(U==='USER'&&P.toUpperCase()==='USER')return 'USER';
  if(U==='ADMIN'&&P==='admin1234')return 'ADMIN';
  if(U==='TRIAL'&&P.toUpperCase()==='TRIAL')return 'TRIAL';
  return '';
}
function doLogin(){
  var role=validLogin(document.getElementById('loginId').value,document.getElementById('loginPass').value);
  if(!role){document.getElementById('loginInfo').className='err';document.getElementById('loginInfo').innerText='LOGIN TIDAK DI TEMUKAN';return}
  localStorage.setItem('scass_pages','1');
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  load();
}
function logout(){localStorage.removeItem('scass_pages');location.reload()}
function show(n){
  ['dash','inv','jual'].forEach(function(x){
    document.getElementById('m-'+x).className=x===n?'':'hide';
    var b=document.getElementById('n-'+x); if(b) b.className='nav'+(x===n?' on':'');
  });
}
function paintInv(){
  var q=(document.getElementById('invQ').value||'').toLowerCase();
  var rows=(data.inventory||[]).filter(function(r){
    if(!q)return true;
    return String(r.SKU||'').toLowerCase().indexOf(q)>=0||String(r.Nama||'').toLowerCase().indexOf(q)>=0;
  });
  document.getElementById('invBody').innerHTML=rows.map(function(r){
    return '<tr><td>'+(r.SKU||'')+'</td><td>'+(r.Nama||'')+'</td><td>'+(r.Kategori||'')+'</td><td>'+(r.Stok||0)+'</td><td>'+rp(r['Harga Jual'])+'</td></tr>';
  }).join('')||'<tr><td colspan="5">Tidak ada data</td></tr>';
}
function paint(){
  var inv=data.inventory||[];
  var nilai=0;
  inv.forEach(function(r){nilai+=(Number(r.Stok)||0)*(Number(r['Harga Beli'])||Number(r['Harga Jual'])||0)});
  document.getElementById('kSku').innerText=inv.length;
  document.getElementById('kStok').innerText=rp(nilai);
  paintInv();
  document.getElementById('soBody').innerHTML=(data.invoice||[]).slice(0,40).map(function(r){
    return '<tr><td>'+(r['No Inv']||'')+'</td><td>'+(r.Nama||'')+'</td><td>'+(r.Qty||'')+'</td><td>'+(r.Status||'')+'</td></tr>';
  }).join('')||'<tr><td colspan="4">Tidak ada invoice</td></tr>';
}
function load(){
  document.getElementById('apiStatus').innerText='Memuat API...';
  api('getErpData',{}).then(function(res){
    data=res||{};
    document.getElementById('apiStatus').innerText='Terhubung · '+(data.inventory||[]).length+' SKU';
    paint();
  }).catch(function(e){
    document.getElementById('apiStatus').className='err';
    document.getElementById('apiStatus').innerText=String(e.message||e);
  });
}
function saveBarang(){
  api('simpanBarang',{
    sku:document.getElementById('bSku').value,
    nama:document.getElementById('bNama').value,
    kategori:document.getElementById('bKat').value,
    satuan:document.getElementById('bSat').value,
    stok:document.getElementById('bStok').value,
    hargaBeli:document.getElementById('bBeli').value,
    hargaJual:document.getElementById('bJual').value,
    minStok:document.getElementById('bMin').value
  }).then(function(){
    document.getElementById('invInfo').innerText='Tersimpan';
    load();
  }).catch(function(e){alert(e.message||e)});
}
if(localStorage.getItem('scass_pages')==='1'){
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  load();
}
</script>
</body>
</html>
